[package]
name = "core_crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["serde"] }
hex = "0.4.3"
libc = "0.2"
ml-kem  = { version = "0.2", features = ["zeroize"] }
fips204 = { version = "0.4", features = ["default-rng"] }
blake3  = "1.5"
rand    = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1.0.229", features = ["derive"] }
aes-gcm = "0.11.1"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1.0.151"
serde_cbor = "0.11"
thiserror = "2.0.20"
hkdf = "0.12"
sha3 = "0.10"

# P3.5.1: Optional real AWS KMS client (behind feature flag so default builds stay lean)
aws-sdk-kms    = "1.0"
aws-config     = "1.0"
tokio          = { version = "1.38", features = ["full"] }
dotenvy = "0.15.0"

[features]
default = []
aws-kms-real = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "pq_crypto_benches"
harness = false

[[bin]]
name = "vendor_admin"
path = "src/bin/vendor_admin.rs"
